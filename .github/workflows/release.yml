name: release

on:
  # Dispatched as well as pushed to: auto-release.yml creates the tag with GITHUB_TOKEN when a
  # release note is merged, and a tag pushed with that token deliberately does not trigger
  # `on: push: tags`. workflow_dispatch is documented as an exception that always creates a run.
  # Dispatched at the tag's ref, so github.ref_name below is the tag either way.
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The release path packs and publishes without re-running validate/sample/e2e, on the grounds
  # that the tagged commit already went through them on its pull request. That reasoning only
  # holds if the commit is genuinely on the default branch — a tag cut from an unmerged branch,
  # or from a commit force-pushed away since, would ship having been verified by nothing. Two
  # cheap ubuntu minutes to make the assumption explicit rather than implicit.
  guard:
    name: verify the tag is on the default branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse a tag that never went through a pull request
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # A tag push checks out the tag, and the default branch's ref is not necessarily among
          # the refs fetched with it, so ask for it by name before testing ancestry.
          git fetch --no-tags --quiet origin \
            "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not an ancestor of ${DEFAULT_BRANCH}. Releases skip the test suites because the tagged commit was verified on its pull request; this commit was not. Merge it first, then re-tag."
            exit 1
          fi

          echo "${GITHUB_REF_NAME} -> ${GITHUB_SHA} is on ${DEFAULT_BRANCH}" >> "$GITHUB_STEP_SUMMARY"

  version:
    name: resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      native-version: ${{ steps.resolve.outputs.native-version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "${version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not look like a version (expected e.g. v3.14.0.1)"
            exit 1
          fi

          # The tag drives which native SDK is bound, so a different line is released simply by
          # tagging it - v3.15.0.1 builds against dd-sdk-ios 3.15.0. Any prerelease suffix is
          # dropped, and the fourth component is this repository's binding revision, not part of
          # the Datadog version: v3.14.0.6 still binds dd-sdk-ios 3.14.0.
          native=$(printf '%s' "${version%%-*}" | cut -d. -f1-3)
          echo "native-version=${native}" >> "$GITHUB_OUTPUT"

          case "${version}" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${version} (prerelease=${prerelease})" >> "$GITHUB_STEP_SUMMARY"

      # The tag deciding everything is also the tag's trap: a mistyped v3.15.0.1 pushed while the
      # branch still pins 3.14.0 would build and publish a 3.15.0 release the branch was never
      # prepared for - unsynced bindings, README and release notes claiming another version.
      # Releasing a line the branch does not pin IS legitimate (that flexibility is the point of
      # deriving from the tag), so the mismatch is a hard stop with an explicit, narrow override
      # rather than a forbidden state: set the repository variable DATADOG_RELEASE_LINE_OVERRIDE
      # (Settings > Secrets and variables > Actions > Variables) to the exact native version
      # being released, e.g. 3.15.0, and re-run this workflow. The variable blesses that one
      # line only - the next typo still fails - and should be removed once the release is done.
      - name: Check the tag against Directory.Build.props
        run: |
          native="${{ steps.resolve.outputs.native-version }}"
          props=$(sed -n 's:.*<DatadogNativeVersion>\(.*\)</DatadogNativeVersion>.*:\1:p' Directory.Build.props | head -1)
          if [ -z "${props}" ]; then
            echo "::error::could not read DatadogNativeVersion from Directory.Build.props"
            exit 1
          fi
          if [ "${native}" = "${props}" ]; then
            echo "Tag ${GITHUB_REF_NAME} matches DatadogNativeVersion ${props}."
            exit 0
          fi
          if [ "${{ vars.DATADOG_RELEASE_LINE_OVERRIDE }}" = "${native}" ]; then
            echo "::warning::releasing dd-sdk-ios ${native} from a branch pinned to ${props}, allowed by DATADOG_RELEASE_LINE_OVERRIDE. Remove the variable once this release is done."
            exit 0
          fi
          echo "::error::tag ${GITHUB_REF_NAME} would release dd-sdk-ios ${native}, but Directory.Build.props pins ${props} - this is what a mistyped tag looks like. If the different line is deliberate, set the repository variable DATADOG_RELEASE_LINE_OVERRIDE to ${native} and re-run this workflow."
          exit 1

  build:
    name: build
    needs: [guard, version]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}
      native-version: ${{ needs.version.outputs.native-version }}
      # Verification already happened on this commit's pull request, and the guard job above
      # proved the tag points at that commit. A release packs and publishes, nothing more.
      verify: false

  publish:
    name: publish to nuget.org and create release
    needs: [version, build]
    runs-on: ubuntu-latest
    # Must match the Environment on the nuget.org trusted publishing policy for this workflow.
    environment: nuget.org
    permissions:
      # contents: write creates the GitHub release; id-token: write lets the job request the OIDC
      # token that nuget.org exchanges for a short-lived API key. Without the latter the token
      # request fails silently and the login step gets no key. attestations: write lets the
      # provenance step store the signed attestation on this repository.
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed to find the previous tag when generating the changelog.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts

      - name: Download dSYMs
        uses: actions/download-artifact@v4
        with:
          name: dsyms
          path: dsyms

      # Zipped here, before anything is published, so the attestation below can cover the zip -
      # the release itself is created last, and attaches this exact file.
      - name: Package dSYMs for the release
        run: |
          # The build workflow puts BUILD-INFO.txt in with the dSYMs, so zipping the directory
          # wholesale ships the build record too. Asserted rather than assumed: a zip without it
          # strands the question the file exists to answer - which Xcode built the binaries these
          # dSYMs symbolicate.
          if [ ! -f dsyms/BUILD-INFO.txt ]; then
            echo "::error::the dsyms artifact carries no BUILD-INFO.txt - the build workflow stopped including the build record"
            exit 1
          fi
          (cd dsyms && zip -qry "../dsyms-${VERSION}.zip" .)

      # A signed, publicly verifiable statement binding each artifact to this exact workflow run
      # - repository, commit, workflow file - checkable with `gh attestation verify`. It is the
      # machine-checkable half of "built by this repository's CI from this tag"; the README's
      # "Verifying a build" section is the honest whole, including what an attestation does not
      # prove. Deliberately before the nuget.org push: if attesting fails, nothing has been
      # published anywhere yet, and a re-run starts clean.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.nupkg
            dsyms-${{ env.VERSION }}.zip

      # nuget.org is published to first: a GitHub release that links to packages which failed to
      # upload would be worse than a release created a moment late.
      # Deliberately immediately before the push: the issued key is valid for one hour, and each
      # OIDC token can be exchanged exactly once.
      - name: Authenticate to nuget.org
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate

      - name: Compose release notes
        run: |
          # Resolved from the tag, not Directory.Build.props, so a release of a different line
          # reports the version it actually bound rather than whatever the branch defaults to.
          native="${{ needs.version.outputs.native-version }}"
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          # A curated docs/release-notes/<version>.md replaces the generated commit list when one
          # exists. The second lookup drops the prerelease suffix, so v2.17.0.1-beta.2 reuses the
          # notes written for 2.17.0.1 rather than silently falling back to raw commit subjects.
          notes="docs/release-notes/${VERSION}.md"
          [ -f "${notes}" ] || notes="docs/release-notes/${VERSION%%-*}.md"

          {
            if [ -f "${notes}" ]; then
              echo "==> using curated notes from ${notes}" >&2
              cat "${notes}"
            else
              echo "## What's changed"
              echo
              if [ -n "${previous}" ]; then
                git log --no-merges --pretty='- %s (%h)' "${previous}..${GITHUB_REF_NAME}"
              else
                # No previous tag: listing every commit would reach back to the repository's first
                # commit, which is noise rather than a changelog.
                echo "Initial release."
              fi
            fi
            echo
            if [ -n "${previous}" ]; then
              echo "**Full changelog**: ${{ github.server_url }}/${{ github.repository }}/compare/${previous}...${GITHUB_REF_NAME}"
              echo
            fi

            echo "## Packages"
            echo
            echo "Bound against [dd-sdk-ios \`${native}\`](https://github.com/DataDog/dd-sdk-ios/releases/tag/${native}), built from source for Mac Catalyst, targeting \`net8.0-maccatalyst18.0\`, \`net9.0-maccatalyst18.0\` and \`net10.0-maccatalyst26.0\`."
            echo
            echo "\`dsyms-${VERSION}.zip\` below carries the dSYMs for these exact binaries - Datadog publishes"
            echo "no Catalyst builds, so this release is the only place they exist. Upload them to Datadog for"
            echo "crash symbolication. The zip also carries \`BUILD-INFO.txt\`: the Xcode, SDK and timestamp the"
            echo "binaries were built with, for anyone rebuilding at this tag to compare."
            echo
            echo "> The first three components of \`${VERSION}\` are the dd-sdk-ios version; the fourth is this"
            echo "> repository's binding revision, which advances when the bindings or packaging change while"
            echo "> the native binaries stay put."
            echo
            echo "| Package | Wraps | NuGet |"
            echo "| --- | --- | --- |"
            # Package id, then the native framework it ships. Kept in the same order as the README.
            while IFS=: read -r package framework; do
              [ -n "${package}" ] || continue
              id="DatadogNet.${package}.Mac"
              echo "| \`${id}\` | \`${framework}\` | [${VERSION}](https://www.nuget.org/packages/${id}/${VERSION}) |"
            done <<'PACKAGES'
          Core:DatadogCore
          RUM:DatadogRUM
          Logs:DatadogLogs
          Trace:DatadogTrace
          SessionReplay:DatadogSessionReplay
          WebViewTracking:DatadogWebViewTracking
          CrashReporting:DatadogCrashReporting
          Flags:DatadogFlags
          Profiling:DatadogProfiling
          Internal:DatadogInternal
          OpenTelemetryApi:OpenTelemetryApi
          PACKAGES
            echo
            echo "\`\`\`"
            echo "dotnet add package DatadogNet.Core.Mac --version ${VERSION}"
            echo "dotnet add package DatadogNet.RUM.Mac --version ${VERSION}"
            echo "\`\`\`"
            echo
            echo "## Licensing"
            echo
            echo "The binding code is MIT; the bundled native binaries are Apache-2.0, built from Datadog's sources, and"
            echo "each package ships both texts under \`licenses/\`."
          } > release-notes.md

          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The packages themselves are not attached: nuget.org is the distribution channel, and
          # the notes link to every published package instead. The dSYMs are attached, because
          # this release is the only place symbolication data for these binaries exists.
          gh release create "${GITHUB_REF_NAME}" \
            "dsyms-${VERSION}.zip" \
            --title "${VERSION}" \
            --notes-file release-notes.md \
            ${{ needs.version.outputs.prerelease == 'true' && '--prerelease' || '' }}

  # The parent repositories pin these packages by exact version; tell them what just shipped
  # rather than leaving it to their daily drift check. Who cares, and about which packages,
  # lives in build/parents.tsv. Skips itself quietly while PARENT_ISSUE_PAT does not exist.
  notify-parents:
    needs: publish
    uses: ./.github/workflows/notify-parents.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
